# Local PostgreSQL for RailPulse
# Usage (from backend/): docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: railpulse-postgres
    environment:
      POSTGRES_USER: railpulse
      POSTGRES_PASSWORD: railpulse123
      POSTGRES_DB: railpulse
    ports:
      - "5432:5432"
    volumes:
      - railpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railpulse -d railpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  railpulse_pgdata:
